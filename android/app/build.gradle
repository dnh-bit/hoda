plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Stable upload signing: keeps the same signature across releases so Android
// installs updates in-place (no uninstall needed). Falls back to the debug key
// when android/key.properties is absent (local dev builds).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.hoda.hoda"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.hoda.hoda"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23 // flutter.minSdkVersion (21) is too low for flutter_local_notifications v17+
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Stable signing config so every release shares one signature and
            // updates install over the previous version without uninstalling.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.create("upload") {
                    storeFile file(keystoreProperties['storeFile'])
                    storePassword keystoreProperties['storePassword']
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                }
            } else {
                // Fallback for local dev builds without key.properties.
                signingConfig = signingConfigs.debug
            }

            // R8 shrinking (on by default for Flutter release builds) strips the
            // generic signatures Gson needs, which made
            // flutter_local_notifications throw "Missing type parameter." from
            // loadScheduledNotifications() on release APKs only. proguard-rules.pro
            // carries the plugin + Gson keep rules that fix it.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Resource shrinking is left off on purpose: it has bitten font and
            // raw asset lookups (Amiri/Vazirmatn) in the past.
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
