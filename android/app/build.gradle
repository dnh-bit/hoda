plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Stable upload signing: keeps the same signature across releases so Android
// installs updates in-place (no uninstall needed). Falls back to the debug key
// when android/key.properties is absent (local dev builds).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.hoda.hoda"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.hoda.hoda"
        minSdk = 23 // flutter.minSdkVersion (21) is too low for flutter_local_notifications v17+
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // App stores (e.g. Cafe Bazaar) order updates by versionCode, which Flutter
        // derives from the build number after '+' in pubspec.yaml. To keep that code
        // monotonic and readable we recompute it from the version name:
        //   versionCode = major*1000 + minor*100 + patch  (0.1.2 -> 102, 1.0.0 -> 1000)
        // The pubspec build number is then irrelevant; never set it below a code an
        // installed build already carries.
        def vParts = (flutter.versionName as String).split('\\.')
        versionCode = (vParts[0] as int) * 1000 + (vParts[1] as int) * 100 + (vParts[2] as int)
    }

    buildTypes {
        release {
            // Stable signing config so every release shares one signature and
            // updates install over the previous version without uninstalling.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.create("upload") {
                    storeFile file(keystoreProperties['storeFile'])
                    storePassword keystoreProperties['storePassword']
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                }
            } else {
                // Fallback for local dev builds without key.properties.
                signingConfig = signingConfigs.debug
            }

            // R8 shrinking (on by default for Flutter release builds) strips the
            // generic signatures Gson needs, which made
            // flutter_local_notifications throw "Missing type parameter." from
            // loadScheduledNotifications() on release APKs only. proguard-rules.pro
            // carries the plugin + Gson keep rules that fix it.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Resource shrinking is left off on purpose: it has bitten font and
            // raw asset lookups (Amiri/Vazirmatn) in the past.
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
