name: hoda
description: "هُدا - اپلیکیشن معنوی روزانه"
publish_to: 'none'
version: 0.1.2+12

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.3
  sqflite: ^2.3.0
  path: ^1.8.3
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/app-profile.png
    - assets/brand/hoda-logo.jpg
    - assets/brand/hoda-typography.jpg
    - assets/hoda.db
    # Shipped so the SIL Open Font License text travels with the Amiri font.
    - assets/fonts/Amiri-OFL.txt
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
    # Naskh face used for Arabic scripture (see lib/widgets/arabic_text.dart).
    # Amiri (c) Khaled Hosny, licensed under the SIL Open Font License 1.1 —
    # full text in assets/fonts/Amiri-OFL.txt.
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
